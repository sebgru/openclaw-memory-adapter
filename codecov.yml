# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# The test suite enforces 100% statement/branch/function/line coverage locally
# via `c8 --100` (`npm run test:coverage`). The status checks below gate the
# Codecov project and patch at the same 100% threshold so that CI and Codecov
# agree, instead of relying on Codecov's implicit "auto" defaults.

coverage:
  precision: 2
  round: down
  range: "100...100"
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

ignore:
  - "test/**"
  - "coverage/**"
